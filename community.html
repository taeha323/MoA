<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소통 커뮤니티 — MoA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="MoA 홈">
        <svg width="28" height="20" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="moaLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3B82F6"/>
              <stop offset="100%" stop-color="#A78BFA"/>
            </linearGradient>
          </defs>
          <path d="M8.5 16C5.46243 16 3 13.3137 3 10C3 6.68629 5.46243 4 8.5 4C12.5 4 15.5 16 19.5 16C22.5376 16 25 13.3137 25 10C25 6.68629 22.5376 4 19.5 4C15.5 4 12.5 16 8.5 16Z" stroke="url(#moaLogoGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">MoA</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="index.html">콘텐츠 탐색</a>
        <a href="about.html">서비스 소개</a>
        <a href="pricing.html">멤버십</a>
        <a href="community.html" class="active">소통 커뮤니티</a>
        <a href="profile.html">내 프로필 · 설정</a>
      </nav>
      <div class="header-cta">
        <a href="pricing.html" class="btn btn-secondary btn-sm">월 3,990원 구독</a>
        <a href="player.html?id=1" class="btn btn-primary btn-sm">PIP 플레이어</a>
      </div>
    </div>
  </header>

  <main id="communityPageRoot" style="padding-top: 84px;">
    <section class="section">
      <div class="container">
        <div style="margin-bottom:36px;">
          <div class="eyebrow">COMMUNITY</div>
          <h1 class="section-title">농인·청인 시청자가 함께 나누는<br />수어 감상 & 배리어프리 커뮤니티</h1>
          <p class="section-desc">수어 통역 후기, 인상 깊었던 수어 표현 질문, 함께 보는 감상 모임 소식을 자유롭게 공유해 보세요.</p>
        </div>

        <div class="filter-group" style="margin-bottom:28px;">
          <button type="button" class="filter-chip comm-filter active" data-cat="ALL">전체</button>
          <button type="button" class="filter-chip comm-filter" data-cat="작품 추천 & 후기">작품 추천 & 후기</button>
          <button type="button" class="filter-chip comm-filter" data-cat="수어 표현 질문">수어 표현 질문</button>
          <button type="button" class="filter-chip comm-filter" data-cat="함께 수어 공부">함께 수어 공부</button>
        </div>

        <div class="community-layout">
          <!-- 좌측: 새 글 작성 폼 -->
          <aside class="compose-card" aria-label="새 게시글 작성">
            <h2 style="font-size:18px; margin-bottom:16px;">새 이야기 남기기</h2>
            <form id="communityPostForm">
              <div class="form-field">
                <label for="postCategory">카테고리</label>
                <select id="postCategory" class="form-select">
                  <option value="작품 추천 & 후기">작품 추천 & 후기</option>
                  <option value="수어 표현 질문">수어 표현 질문</option>
                  <option value="함께 수어 공부">함께 수어 공부</option>
                </select>
              </div>

              <div class="form-field">
                <label for="postAuthor">작성자 닉네임</label>
                <input type="text" id="postAuthor" class="form-input" placeholder="예: 부산시청자_태하" />
              </div>

              <div class="form-field">
                <label for="postTitle">제목</label>
                <input type="text" id="postTitle" class="form-input" placeholder="제목을 입력해 주세요" required />
              </div>

              <div class="form-field">
                <label for="postBody">내용</label>
                <textarea id="postBody" class="form-textarea" placeholder="감상평이나 수어 표현에 대한 질문을 자유롭게 적어 주세요." required></textarea>
              </div>

              <button type="submit" class="btn btn-primary" style="width:100%;">게시글 등록하기</button>
            </form>
          </aside>

          <!-- 우측: 게시글 목록 -->
          <div class="post-list" id="communityPostList"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© 2026 MoA. All Rights Reserved.</span>
      <span>AI Sign Language OTT Accessibility</span>
    </div>
  </footer>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
