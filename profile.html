<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 프로필 · 설정 — MoA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="MoA 홈">
        <svg width="28" height="20" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="moaLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3B82F6"/>
              <stop offset="100%" stop-color="#A78BFA"/>
            </linearGradient>
          </defs>
          <path d="M8.5 16C5.46243 16 3 13.3137 3 10C3 6.68629 5.46243 4 8.5 4C12.5 4 15.5 16 19.5 16C22.5376 16 25 13.3137 25 10C25 6.68629 22.5376 4 19.5 4C15.5 4 12.5 16 8.5 16Z" stroke="url(#moaLogoGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">MoA</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="index.html">콘텐츠 탐색</a>
        <a href="about.html">서비스 소개</a>
        <a href="pricing.html">멤버십</a>
        <a href="community.html">소통 커뮤니티</a>
        <a href="profile.html" class="active">내 프로필 · 설정</a>
      </nav>
      <div class="header-cta">
        <a href="pricing.html" class="btn btn-secondary btn-sm">멤버십 관리</a>
        <a href="player.html?id=1" class="btn btn-primary btn-sm">PIP 플레이어</a>
      </div>
    </div>
  </header>

  <main id="profilePageRoot" style="padding-top: 84px;">
    <section class="section">
      <div class="container" style="max-width:760px;">
        <div style="margin-bottom:32px;">
          <div class="eyebrow">PROFILE & PIP PRESETS</div>
          <h1 class="section-title">내 프로필 및 수어 PIP 기본 설정</h1>
          <p class="section-desc">저장한 아바타 캐릭터·크기·위치·투명도·재생 속도는 PIP 플레이어를 열 때마다 자동으로 반영됩니다.</p>
        </div>

        <div class="compose-card" style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <span style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">현재 멤버십 상태</span>
            <strong id="profilePlanBadge" style="font-size:15px; color:var(--accent-lavender);">Basic 무료 플랜 이용 중</strong>
          </div>
          <a href="pricing.html" class="btn btn-secondary btn-sm">멤버십 변경하기</a>
        </div>

        <form id="profileForm" class="compose-card">
          <div class="about-grid" style="gap:18px; margin-bottom:18px;">
            <div class="form-field" style="margin-bottom:0;">
              <label for="profName">표시 이름 (닉네임)</label>
              <input type="text" id="profName" class="form-input" value="김태하" />
            </div>

            <div class="form-field" style="margin-bottom:0;">
              <label for="profRole">시청 유형</label>
              <select id="profRole" class="form-select">
                <option value="농인 시청자 (KSL 주언어)">농인 시청자 (KSL 주언어)</option>
                <option value="난청 시청자 (수어+자막 병행)">난청 시청자 (수어+자막 병행)</option>
                <option value="수어 학습자 · 미디어 기획" selected>수어 학습자 · 미디어 기획</option>
              </select>
            </div>

            <div class="form-field" style="margin-bottom:0;">
              <label for="profCharacter">기본 수어 아바타 캐릭터</label>
              <select id="profCharacter" class="form-select">
                <option value="moa" selected>모아 · 표준 AI 아바타</option>
                <option value="seoyeon">서연 · 감성 드라마형</option>
                <option value="dohyun">도현 · 선명 전달형</option>
                <option value="nova">노바 · 고대비 미니멀</option>
              </select>
            </div>

            <div class="form-field" style="margin-bottom:0;">
              <label for="profPosition">기본 화면 배치 위치</label>
              <select id="profPosition" class="form-select">
                <option value="bottom-right">우측 하단</option>
                <option value="bottom-left">좌측 하단</option>
                <option value="top-right">우측 상단</option>
                <option value="top-left">좌측 상단</option>
              </select>
            </div>

            <div class="form-field" style="margin-bottom:0;">
              <label for="profScale">기본 아바타 크기 (%)</label>
              <input type="number" id="profScale" class="form-input" min="75" max="135" value="100" />
            </div>

            <div class="form-field" style="margin-bottom:0;">
              <label for="profOpacity">기본 배경 투명도 (%)</label>
              <input type="number" id="profOpacity" class="form-input" min="50" max="100" value="95" />
            </div>

            <div class="form-field" style="margin-bottom:0; grid-column: 1 / -1;">
              <label for="profSpeed">기본 수어 싱크 속도 (배속)</label>
              <select id="profSpeed" class="form-select">
                <option value="0.8">0.8x (느리게)</option>
                <option value="0.9">0.9x</option>
                <option value="1.0" selected>1.0x (표준)</option>
                <option value="1.2">1.2x</option>
                <option value="1.4">1.4x (빠르게)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;">프로필 및 기본 PIP 설정 저장</button>
          <p id="profileSaveMsg" style="font-size:13px; color:var(--accent-lavender); margin-top:12px; min-height:20px; text-align:center;"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© 2026 MoA. All Rights Reserved.</span>
      <span>AI Sign Language OTT Accessibility</span>
    </div>
  </footer>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
