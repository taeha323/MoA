<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoA (모아) - OTT PIP 수어 통역 공생 플랫폼</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-badge">MoA</span>
      <span class="logo-text">AI 수어 통역 OTT 큐레이션 & PIP 허브</span>
    </div>
    <div class="nav-right">
      <a href="admin.html" class="btn-admin-link">관리자 대시보드 ↗</a>
      <button id="open-pip-btn" class="btn-pip-launch">모아 PIP 창 띄우기</button>
      <div class="status-indicator">
        <span id="db-status" class="status-dot offline"></span>
        <span id="db-status-text">DB 연결 확인중</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 좌측: OTT별 수어 번역 지원 콘텐츠 리스트 -->
    <section class="catalog-section">
      <div class="hero-banner">
        <h1>기존 OTT 위에서 만나는 맞춤형 AI 3D 수어 통역</h1>
        <p>비파괴형 연결 권리 계약이 완료된 작품을 선택하면 공식 OTT로 이동하며, AI 아바타 <strong>'모아'</strong>가 PIP 오버레이로 실시간 통역을 제공합니다.</p>
      </div>

      <!-- OTT 플랫폼 필터 탭 -->
      <div class="platform-tabs" id="platform-tabs">
        <button class="tab active" data-platform="ALL">전체</button>
        <button class="tab" data-platform="Netflix">넷플릭스</button>
        <button class="tab" data-platform="TVING">티빙</button>
        <button class="tab" data-platform="Wavve">웨이브</button>
        <button class="tab" data-platform="Disney+">디즈니+</button>
      </div>

      <!-- 콘텐츠 카드 그리드 (Supabase DB에서 자동 렌더링) -->
      <div class="content-grid" id="content-grid"></div>
    </section>

    <!-- 우측: PIP 아바타 개인화 설정 패널 -->
    <aside class="settings-panel">
      <div class="panel-title">
        <h2>PIP 아바타 '모아' 설정</h2>
        <p>공식 OTT 영상 위에 띄울 수어 통역 창을 맞춤 설정합니다.</p>
      </div>

      <!-- 미리보기 PIP 위젯 -->
      <div class="pip-preview-box">
        <div class="pip-window" id="pip-window">
          <div class="pip-header">
            <span class="pip-badge">MoA PIP · <span id="pip-now-playing">대기중</span></span>
            <span class="pip-speed" id="pip-speed-badge">1.0x</span>
          </div>
          <div class="pip-avatar-stage">
            <div class="avatar-figure">
              <div class="head"></div>
              <div class="torso">
                <div class="arm left"></div>
                <div class="arm right"></div>
              </div>
            </div>
            <p class="sign-caption" id="sign-caption">작품 선택 시 PIP 통역 시작</p>
          </div>
        </div>
      </div>

      <!-- 설정 슬라이더 -->
      <div class="control-group">
        <div class="label-row">
          <label for="scale-slider">PIP 아바타 크기</label>
          <span id="scale-val">100%</span>
        </div>
        <input type="range" id="scale-slider" min="80" max="130" value="100" />
      </div>

      <div class="control-group">
        <div class="label-row">
          <label for="opacity-slider">PIP 창 배경 투명도</label>
          <span id="opacity-val">90%</span>
        </div>
        <input type="range" id="opacity-slider" min="30" max="100" value="90" />
      </div>

      <div class="control-group">
        <div class="label-row">
          <label for="speed-slider">수어 통역 싱크 속도</label>
          <span id="speed-val">1.0x</span>
        </div>
        <input type="range" id="speed-slider" min="0.8" max="1.3" step="0.1" value="1.0" />
      </div>

      <button id="save-settings-btn" class="btn-save">내 PIP 설정 DB에 저장</button>
      <p id="toast" class="toast"></p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
